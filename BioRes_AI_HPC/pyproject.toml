[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "biores-ai-hpc"
version = "0.1.0"
description = "Bio-inspired resilience framework for safe and verified recovery in AI/HPC workflows."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Patrick Lemoine" }
]
dependencies = [
  "PyYAML>=6.0",
  "typer>=0.12.0",
  "rich>=13.7.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "ruff>=0.6.0",
  "mypy>=1.10.0"
]

[project.scripts]
biores = "biores_ai_hpc.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.mypy]
python_version = "3.10"
mypy_path = "src"
check_untyped_defs = true
disallow_untyped_defs = true